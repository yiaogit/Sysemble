name: CI

on:
  push:
  pull_request:

jobs:
  schema:
    name: Validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install --quiet jsonschema pyyaml
      - name: Validate schemas and examples
        run: python tools/validate.py

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: cargo test --workspace

  boot-smoke:
    name: Boot smoke (Debian)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            qemu-system-x86 qemu-utils e2fsprogs jq \
            gdisk dosfstools mtools grub-efi-amd64-bin grub-common ovmf

      - name: Plan minimal image
        run: cargo run -q -p sysemble-cli -- plan examples/minimal-debian.yaml > plan.json

      - name: Build disk image
        run: sudo env PATH="$PATH" bash builders/debian/build.sh --plan plan.json --out out --execute

      - name: Hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Boot and assert
        run: bash tools/boot-check.sh --artifact out/artifact.json --timeout 300 --json

      - name: Upload boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence
          if-no-files-found: warn
          path: |
            plan.json
            out/artifact.json
            out/build.log
            out/boot.log
            out/boot-evidence.json

  desktop-smoke:
    name: Desktop smoke (XFCE)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            qemu-system-x86 qemu-utils e2fsprogs jq \
            gdisk dosfstools mtools grub-efi-amd64-bin grub-common ovmf

      - name: Plan desktop image
        run: cargo run -q -p sysemble-cli -- plan examples/debian-xfce.yaml > plan.json

      - name: Build desktop image
        run: sudo env PATH="$PATH" bash builders/debian/build.sh --plan plan.json --out out --execute

      - name: Hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Boot and assert the desktop
        run: bash tools/boot-check.sh --artifact out/artifact.json --timeout 600 --json

      - name: Upload desktop boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence-desktop
          if-no-files-found: warn
          path: |
            plan.json
            out/artifact.json
            out/build.log
            out/boot.log
            out/boot-evidence.json

  live-smoke:
    name: Live ISO smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            qemu-system-x86 qemu-utils e2fsprogs jq \
            gdisk dosfstools mtools grub-efi-amd64-bin grub-common ovmf \
            xorriso squashfs-tools

      - name: Plan live ISO
        run: cargo run -q -p sysemble-cli -- plan examples/minimal-debian-live.yaml > plan.json

      - name: Build live ISO
        run: sudo env PATH="$PATH" bash builders/debian/build.sh --plan plan.json --out out --execute

      - name: Hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Boot the ISO and assert
        run: bash tools/boot-check.sh --artifact out/artifact.json --timeout 600 --json

      - name: Upload live boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence-live
          if-no-files-found: warn
          path: |
            plan.json
            out/artifact.json
            out/build.log
            out/boot.log
            out/boot-evidence.json

  install-smoke:
    name: Install smoke (headless)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and boot tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            qemu-system-x86 qemu-utils e2fsprogs jq \
            gdisk dosfstools mtools grub-efi-amd64-bin grub-common ovmf \
            xorriso squashfs-tools

      - name: Plan installer image
        run: cargo run -q -p sysemble-cli -- plan examples/minimal-debian-live.yaml > plan.json

      - name: Build installer ISO
        run: sudo env PATH="$PATH" bash builders/debian/build.sh --plan plan.json --out out --execute --installer

      - name: Hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Install to a blank disk and boot the result
        run: bash tools/install-check.sh --artifact out/artifact.json --timeout 1200 --workdir out/install --json

      - name: Upload install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence-install
          if-no-files-found: warn
          path: |
            plan.json
            out/artifact.json
            out/build.log
            out/install.log
            out/install-evidence.json
            out/install-boot.log

  desktop-check:
    name: Desktop app (check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libssl-dev patchelf

      - name: Check the desktop crate
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Test the desktop crate
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  tui-install-smoke:
    name: TUI install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install build, boot, and expect tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mmdebstrap debian-archive-keyring \
            qemu-system-x86 qemu-utils e2fsprogs jq \
            gdisk dosfstools mtools grub-efi-amd64-bin grub-common ovmf \
            xorriso squashfs-tools expect

      - name: Plan TUI installer image
        run: cargo run -q -p sysemble-cli -- plan examples/minimal-debian-live.yaml > plan.json

      - name: Build TUI installer ISO
        run: sudo env PATH="$PATH" bash builders/debian/build.sh --plan plan.json --out out --execute --installer-tui

      - name: Hand build output back to the runner user
        run: sudo chown -R "$(id -u):$(id -g)" out

      - name: Drive the TUI, install, and boot the result
        run: bash tools/tui-install-check.sh --artifact out/artifact.json --hostname sysemble-tui --timeout 1200 --workdir out/tui --json

      - name: Upload TUI install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boot-evidence-tui-install
          if-no-files-found: warn
          path: |
            plan.json
            out/artifact.json
            out/build.log
            out/tui-install.log
            out/tui-install-evidence.json
            out/tui-install-boot.log
