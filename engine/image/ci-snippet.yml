# P1-e2a engine-check job fragment.
#
# Paste under `jobs:` in .github/workflows/ci.yml (the main thread merges it).
# Frozen by docs/plan/P1-e2-workplan.md section 5: ubuntu-latest, 45 minutes,
# build -> verify -> plan -> container build + boot-check -> evidence artifact.
  engine-check:
    name: Engine image (build + boot)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the engine image
        run: |
          bash engine/image/build-image.sh \
            --ref sysemble-engine:0.1.0 \
            --out engine/image/build

      - name: Verify the image manifest
        run: bash engine/image/tests/image_test.sh --docker

      - name: Plan the minimal image
        run: |
          mkdir -p engine/image/build/smoke
          cargo run -q -p sysemble-cli -- plan examples/minimal-debian.yaml \
            > engine/image/build/smoke/plan.json

      - name: Build and boot inside the engine container
        run: |
          bash engine/image/tests/container_smoke.sh \
            --image sysemble-engine:0.1.0 \
            --repo "$PWD" \
            --out engine/image/build/smoke

      - name: Upload engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-evidence
          if-no-files-found: warn
          path: |
            engine/image/build/sysemble-engine.json
            engine/image/build/build-image.log
            engine/image/build/smoke/container-build.log
            engine/image/build/smoke/artifact.json
            engine/image/build/smoke/boot.log
            engine/image/build/smoke/boot-evidence.json
